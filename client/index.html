<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Strivo — private video sharing</title>
  </head>
  <body>
    <!-- Shown until the app starts. React replaces it; if it stays on screen, JavaScript
         failed in this browser — much better than a blank white page. -->
    <div id="root">
      <div style="font-family: sans-serif; font-size: 22px; padding: 24px">
        <p>Loading Strivo…</p>
        <p>If this message stays on screen, this browser cannot run the full app. Use the simple TV version instead:</p>
        <p>
          <a href="/tv" style="display: inline-block; padding: 16px 28px; font-size: 26px; background: #2f6fed; color: #fff; text-decoration: none; border: 4px solid #f5a623; border-radius: 10px">
            Open simple TV version
          </a>
        </p>
        <p id="boot-error" style="color: #c62f2f; font-size: 16px"></p>
        <p id="boot-ua" style="color: #777; font-size: 14px"></p>
      </div>
    </div>
    <!-- Old-style JavaScript (ES3) on purpose, so even ancient browsers run it: shows WHY
         the app failed and which browser engine this is. Allowed by the server's CSP via its hash. -->
    <script>
      (function () {
        // Append (not replace): the FIRST error is usually the real cause.
        function add(id, text) {
          var el = document.getElementById(id);
          if (!el) return;
          if (el.firstChild) el.appendChild(document.createElement('br'));
          el.appendChild(document.createTextNode(text));
        }
        add('boot-ua', 'Browser: ' + navigator.userAgent);
        window.onerror = function (message, source, line) {
          var file = source ? String(source).split('/').pop() : '';
          add('boot-error', 'Error: ' + message + (file ? ' in ' + file : '') + (line ? ' (line ' + line + ')' : ''));
        };
        window.onunhandledrejection = function (event) {
          var reason = event && event.reason;
          add('boot-error', 'Error: ' + (reason && reason.message ? reason.message : reason));
        };
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
